  # 5. Databases
  postgres:
    image: postgres:18.3-alpine
    container_name: lzy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5500:5432"
    volumes:
      - lzy-postgres-data:/var/lib/postgresql/data
    networks:
      - lzy-network

  mongodb:
    image: mongo:8.0
    container_name: lzy-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27000:27017"
    volumes:
      - lzy-mongo-data:/data/db
    networks:
      - lzy-network

networks:
  lzy-network:
    driver: bridge

volumes:
  lzy-postgres-data:
  lzy-mongo-data:
