# Global Nginx Configuration for Service Orchestration
# Overhauled for Phase 3: Logic Migration and Clean Routing

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Service Upstreams (Internal Container Ports)
    upstream lzy_svc {
        server lzy-svc:8888;
    }

    upstream lzy_director {
        server lzy-director:9999;
    }

    upstream lzy_frontend {
        server lzy-frontend:5555;
    }

    server {
        # Entry Point: User-requested port 3333
        listen 3333;
        server_name localhost;

        # 1. Primary Orchestrator (Go): /api/v1/lzy-svc
        location /api/v1/lzy-svc/ {
            proxy_pass http://lzy_svc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Optimized Engine (Python): /api/v1/lzy-director
        # Now focused exclusively on video generation
        location /api/v1/lzy-director/ {
            proxy_pass http://lzy_director/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Frontend UI: Fallthrough to React
        location / {
            proxy_pass http://lzy_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Standard Error handling
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
